# Dataset ----------------------------------------------------------------------
dataset:
  train_datasets:
    - root: /srv/hspn_data/naca0012_reprocessed/reprocessed/
      node_file: /srv/hspn_data/naca0012_reprocessed/reprocessed/nodes.npy
      edge_file: /srv/hspn_data/naca0012_reprocessed/reprocessed/edges_cell.npy
      field_dir:
        -  Unsteady_NACA0012_aoa_10
        -  Unsteady_NACA0012_aoa_12
        -  Unsteady_NACA0012_aoa_17
        -  Unsteady_NACA0012_aoa_20

  valid_datasets:
    - root: /srv/hspn_data/naca0012_reprocessed/reprocessed/
      node_file: /srv/hspn_data/naca0012_reprocessed/reprocessed/nodes.npy
      edge_file: /srv/hspn_data/naca0012_reprocessed/reprocessed/edges_cell.npy
      field_dir:
        -  Unsteady_NACA0012_aoa_10
      
  fields: ["Density"]

  time_minimum: 100
  time_maximum: 499

  bounds:
    x_min: -0.5
    x_max: 3.5
    y_min: -1.0
    y_max: 1.0

  bundle: 2
  push_forward: 2
  noise: 1e-4
  dimensions: 2
  n_params: 2 #must equal length of params.json
  bundle_style: non_overlapping
  max_samples_per_field_dir: -1
  update_node_tags: [0]

# Model ------------------------------------------------------------------------
#model:
#  activation: silu
# hidden_channels: 32
#  mlp_width: 40
#  mlp_depth: 3
#  dropout: 0.0
#  n_processing_blocks: 9
#  checkpointed: false
#  reweight: false
model:
  deeponet_type: "both" 
  time_aggregation: "flatten"
  time_integration: "linear"
  latent_dimension: 32
  n_processors: 9
  edge_encoder:
    hidden_width: 40
    hidden_layers: 3
    activation: silu
  node_encoder:
    hidden_width: 40
    hidden_layers: 3
    activation: silu
  node_decoder:
    hidden_width: 40
    hidden_layers: 3
    activation: silu
  edge_updater:
    hidden_width: 40
    hidden_layers: 3
    activation: silu
    ReZero: true
  node_updater:
    hidden_width: 40
    hidden_layers: 3
    activation: silu
    ReZero: true
  branch_net:
    hidden_width: 40
    hidden_layers: 3
    activation: silu
# Training ---------------------------------------------------------------------
seed: 42
n_epochs: 201
learning_rate: 9.99e-3
batch_size: 3
log_interval: 10
# Loss -------------------------------------------------------------------------
loss:
  type: "mse"  # options: "mse", "gradient_weighted", "energy"
  # gradient_weighted requires ≥2 fields with velocity as the last two.
  # DO NOT use with single-field datasets like NACA (Density only).
  gradient_weighted:
    lambda_gradient: 2.0
  # energy requires velocity_indices and buoyancy_idx pointing to actual fields.
  energy:
    velocity_indices: []      # e.g. [1, 2] for vx, vy
    buoyancy_idx: null        # e.g. 0 for temperature/density
    ke_weight: 1.0
    ape_weight: 1.0
    pe_min_weight: 1.0
    monotonic_weight: 0.1
# Dataloaders ------------------------------------------------------------------
dataloader:
  _target_: torch.utils.data.DataLoader
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

val_dataloader:
  _target_: torch.utils.data.DataLoader
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

# Optimizer ------------------------------------------------------------------
optimizer:
  _target_: schedulefree.AdamWScheduleFree
  lr: ${learning_rate}

# Scheduler --------------------------------------------------------------------
scheduler:
  _target_: torch.optim.lr_scheduler.ConstantLR
  factor: 1.0
  total_iters: 1

# Paths / Misc
checkpoint_dir: ./models/ckpt
results_dir: ./models/
tag: both

# Optional tracker (Aim Run or null)
# tracker: null # set to null to disable
tracker:
  _target_: aim.Run
  repo: .
  experiment: ${hydra:job.config_name}

trainer: null
#trainer:
#  num_workers: 1
#  use_gpu: true
#  resources_per_worker: { "CPU": 8, "GPU": 1 }

rollout:
  enabled: false  # Set to true to run rollout after training
  rollout_dir: /srv/hspn_data/naca0012_reprocessed/reprocessed/Unsteady_NACA0012_aoa_15
  node_file: /srv/hspn_data/naca0012_reprocessed/reprocessed/nodes.npy
  edge_file: /srv/hspn_data/naca0012_reprocessed/reprocessed/edges_cell.npy
  start_idx: 100
  output_dir: ${results_dir}/rollouts
  # baseline_vtu is resolved automatically from dataset config (see Section 7)
  # override here only if you need a different VTU:
  # baseline_vtu_override: /path/to/different.vtu

  movie:
    enabled: false
    fps: 24
    quality: 8
    cmap: viridis
